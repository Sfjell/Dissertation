<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { background-color: #f4f7fc; font-family: 'Arial', sans-serif; }
        .auth-container { max-width: 400px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .auth-title { font-size: 1.8rem; font-weight: bold; text-align: center; color: #333; margin-bottom: 20px; }
        .form-control { border-radius: 8px; }
        .btn-auth { background-color: #007bff; border-color: #007bff; width: 100%; padding: 10px; border-radius: 8px; font-size: 1.2rem; }
        .btn-auth:hover { background-color: #0056b3; }
        .auth-footer { text-align: center; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="auth-container" id="loginContainer">
            <h2 class="auth-title">Login</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-auth">Login</button>
            </form>
            <div class="auth-footer">
                <p>Don't have an account? <a href="Register.html" id="showRegister">Sign up</a></p>
            </div>
        </div>

        <!-- Registration Form -->
        <div class="auth-container hidden" id="registerContainer">
            <h2 class="auth-title">Register</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="registerEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="registerEmail" required>
                </div>
                <div class="mb-3">
                    <label for="registerPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="registerPassword" required>
                </div>
                <button type="submit" class="btn btn-auth">Sign Up</button>
            </form>
            <div class="auth-footer">
                <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
    
            try {
                const response = await fetch("http://localhost:5000/login", {  // ✅ Corrected API endpoint
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password }),
                });
    
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("userId", data.userId);
                    localStorage.setItem("userEmail", email);
    
                    alert("✅ Login successful!");
                    window.location.href = "index.html"; // ✅ Redirect to home page
                } else {
                    alert(data.error);
                }
            } catch (error) {
                console.error("❌ Error during login:", error);
                alert("Login failed. Please try again later.");
            }
        });
    
        // ✅ If user is already logged in, redirect to homepage
        if (localStorage.getItem("token")) {
            window.location.href = "index.html";
        }
    </script>
    
</body>
</html>
