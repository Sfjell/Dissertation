<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background-color: #f0f4f7; font-family: 'Arial', sans-serif; }
        .navbar { background-color: #fff; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); }
        .system-card { background-color: #fff; padding: 20px; border-radius: 10px; }
        .green-box { background-color: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 5px solid #28a745; cursor: pointer; }
        .footer { background-color: #000; color: white; text-align: center; padding: 20px 0; position: fixed; width: 100%; bottom: 0; }
    </style>
</head>

<body>
    <div class="hero-section text-center text-white p-4" style="background-color: #42f8b2;">
        <h1>Welcome to the System Dashboard</h1>
        <p>Explore systems, ask questions, and find solutions faster.</p>
    </div>

    <div class="container my-4">
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand" href="index.html"><img src="2.png" alt="Brand Logo" style="height: 40px;"></a>
        </nav>

        <h4 class="mt-4">Top 3 Rated Systems</h4>
        <div class="row" id="topSystems"></div>

        <h4 class="mt-4">Latest Questions</h4>
        <div id="questions"></div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 SysReviewSphere. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchTopSystems() {
            const response = await fetch("http://localhost:5000/get-feedbacks");
            const feedbacks = await response.json();
            feedbacks.sort((a, b) => b.rating - a.rating);
            const top3 = feedbacks.slice(0, 3);

            document.getElementById("topSystems").innerHTML = top3.map(system => `
                <div class="col-md-4 mb-3">
                    <div class="system-card text-center">
                        <img src="http://localhost:5000${system.logoPath}" alt="Logo" style="width: 100px; height: 100px;">
                        <h5>${system.companyName}</h5>
                        <p>${system.experienceDescription}</p>
                        <p>Rating: ${'★'.repeat(system.rating)}${'☆'.repeat(5 - system.rating)}</p>
                    </div>
                </div>
            `).join("");
        }

        async function fetchQuestions() {
            const response = await fetch("http://localhost:5000/get-questions");
            const questions = await response.json();
            document.getElementById("questions").innerHTML = questions.map(q => `
                <div class="green-box" data-bs-toggle="collapse" data-bs-target="#answer${q._id}">
                    <div>${q.questionText}</div>
                    <span>▼</span>
                </div>
                <div id="answer${q._id}" class="collapse">
                    ${q.answers.map(ans => `<p>${ans}</p>`).join(" ")}
                </div>
            `).join("");
        }

        fetchTopSystems();
        fetchQuestions();
    </script>
</body>

</html>
