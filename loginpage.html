<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            background-color: #f4f7fc;
            font-family: 'Arial', sans-serif;
        }

        /* Styles the authentication container */
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Styles the authentication title */
        .auth-title {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Rounds the corners of form input fields */
        .form-control {
            border-radius: 8px;
        }

        /* Styles the authentication button */
        .btn-auth {
            background-color: #007bff;
            border-color: #007bff;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 1.2rem;
        }

        /* Changes button color on hover */
        .btn-auth:hover {
            background-color: #0056b3;
        }

        /* Styles the authentication footer */
        .auth-footer {
            text-align: center;
            margin-top: 15px;
        }

        /* Styles error messages */
        .error-message {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- This is the form the users will se when they log in. They will be asked to enter there email and password. if they do not have an account they can press the sign up button.-->
    <div class="container">
        <div class="auth-container" id="loginContainer">
            <h2 class="auth-title">Login</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-auth">Login</button>
                <p class="error-message" id="loginError"></p>
            </form>
            <div class="auth-footer">
                <p>Do you not have an account? <a href="registerpage.html">Sign up</a></p>
            </div>
        </div>
    </div>

    <script>
        // Cheking if the user is logged in
        document.addEventListener("DOMContentLoaded", () => {
            checkLoginStatus();
        });

        // when the login form is sent
        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            // Finding the users email and password form the form
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            const errorMessage = document.getElementById("loginError");

            try {

                // sending a POST-request to the surver for authentication of the user
                const response = await fetch("http://localhost:5000/my_diss/login", {
                    method: "POST", // Usin the POST-metod for sending login data
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json(); // Geting the JSON-data fron the server

                if (response.ok) {

                    // Saving the token, user id and email in localStorage so it can be used later
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("userId", data.userId);
                    localStorage.setItem("userEmail", email);

                    // Sending the user back to the index page if the login was succesful
                    window.location.href = "index.html";
                } else {
                    errorMessage.textContent = data.error || "Invalid login credentials.";
                    localStorage.removeItem("token");
                }
            } catch (error) {
                console.error("Error during login:", error);
                errorMessage.textContent = "On no, an error occurred. Please try again later.";
            }
        });

        // Cheking if the users login stauts based on the saved token. 
        async function checkLoginStatus() {
            const token = localStorage.getItem("token"); // Geting the token from LocalStorage
            if (!token) {
                if (!window.location.href.includes("loginpage.html")) {
                    window.location.href = "loginpage.html";
                }
                return; // Ending the process if the token was not found
            }

            try {
                 // Chacking if the token is valied by sending a GET-request to the server with the Authorization-header.
                const response = await fetch("http://localhost:5000/my_diss/check-token", {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` },
                });
                // if the respons is not okey, logout the user.
                if (!response.ok) {
                    console.warn("Token expired or invalid. Redirecting to login...");
                    logoutUser();
                }
            } catch (error) {
                console.error("Error checking token:", error);
                logoutUser();
            }
        }

        // Function for logging a user out, removes the data from localStorage and redirecting to login-page.
        function logoutUser() {
            localStorage.removeItem("token");
            localStorage.removeItem("userId");
            localStorage.removeItem("userEmail");
            window.location.href = "loginpage.html";
        }
    </script>
</body>

</html>
