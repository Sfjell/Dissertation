<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #eef2f7;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Styles the profile header */
        .profile-header {
            width: 100%;
            background-color: #e16539;
            color: white;
            text-align: center;
            padding: 50px 20px;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }

        /* Styles the profile icon */
        .profile-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: auto;
            background-color: #555;
            color: white;
        }

        /* Styles the contributions header */
        .contributions-header {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-top: 30px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #e16539;
            display: block;
        }

        .section-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #444;
            margin-top: 20px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #e16539;
            display: inline-block;
            width: auto;
        }

        .container h5,
        .container h4 {
            text-align: center;
            font-weight: bold;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        /* Styles the post list container */
        .post-list {
            max-width: 700px;
            margin: auto;
            margin-top: 20px;
        }

        /* Styles the post items */
        .post-item {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            text-align: left;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        /* Adds hover effects to post items */
        .post-item:hover {
            transform: scale(1.02);
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Styles the text in post items */
        .post-item h6 {
            margin: 0;
            font-weight: bold;
        }

        /* Styles paragraphs inside post items */
        .post-item p {
            margin: 5px 0;
            color: #555;
        }

        /* Styles the star rating */
        .rating {
            color: gold;
            font-weight: bold;
        }

        /* Styles the button group */
        .btn-group-custom {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        /* Styles small buttons */
        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 5px;
        }

        /* Styles the black button */
        .btn-black {
            background-color: black;
            color: white;
            border-radius: 5px;
        }

        /* Changes the black button color on hover */
        .btn-black:hover {
            background-color: #333;
        }

        .btn-danger {
            border-radius: 5px;
        }

        /* Styles the settings card */
        .settings-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
            text-align: center;
            display: none;
        }

        .form-control {
            border-radius: 5px;
            max-width: 400px;
            margin: auto;
        }

        /* Styles the modal confirmation dialog */
        .modal-confirm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 320px;
            z-index: 1000;
        }

        .form-control:focus {
            border-color: #e16539;
            box-shadow: 0 0 5px #e16539;
            outline: none;
        }

        /* Styles the modal overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        /* Reduces opacity of active buttons */
        .active-btn {
            opacity: 0.7;
        }

        /* Styles the home button */
        .home-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #e16539;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s ease-in-out;
        }

        /* Styles the icon inside the home button */
        .home-button i {
            font-size: 18px;
        }

        /* Changes home button background color on hover */
        .home-button:hover {
            background-color: #c84f2f;
        }

        .btn-primary {
            background-color: #e16539;
            border-color: #e16539;
        }

        /* Styles the primary button focus and active states */
        .btn-primary:focus,
        .btn-primary:active {
            background-color: darkorange !important;
            border-color: darkorange !important;
            box-shadow: 0 0 5px #e16539;
            outline: none;
        }
    </style>
</head>

<body>
    <a href="index.html" class="home-button">
        <i class="fas fa-arrow-left"></i> Main page
    </a>

    <div class="profile-header">
        <div class="profile-icon" id="profileIcon">AB</div>
        <h2 id="profileName" class="mt-2">Guest</h2>
    </div>

    <div class="container">
        <div class="btn-group-custom">
            <button class="btn btn-black btn-small" id="toggleSettingsBtn">Settings</button>
            <button class="btn btn-danger btn-small" id="deleteAccountBtn">Delete Account</button>
        </div>

        <div id="settingsCard" class="container p-4" style="display: none;">
            <div class="card shadow p-4">
                <h3 class="text-center">Account Settings</h3>
                <h6 class="text-center">Change Details</h6>

                <form id="updateProfileForm">
                    <div class="mb-3 row">
                        <label for="name" class="col-sm-2 col-form-label text-end">Name</label>
                        <div class="col-sm-10">
                            <input type="text" id="name" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="age" class="col-sm-2 col-form-label text-end">Age</label>
                        <div class="col-sm-10">
                            <input type="number" id="age" class="form-control" min="1" required>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="gender" class="col-sm-2 col-form-label text-end">Gender</label>
                        <div class="col-sm-10">
                            <select id="gender" class="form-control" required>
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                                <option value="prefer_not_to_say">Prefer not to say</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="occupation" class="col-sm-2 col-form-label text-end">Occupation</label>
                        <div class="col-sm-10">
                            <select id="occupation" class="form-control" required>
                                <option value="">Select Occupation</option>
                                <option value="software_engineer">Software engineer</option>
                                <option value="data_scientist">Data scientist</option>
                                <option value="teacher">Teacher</option>
                                <option value="doctor">Doctor</option>
                                <option value="nurse">Nurse</option>
                                <option value="engineer">Engineer</option>
                                <option value="accountant">Accountant</option>
                                <option value="lawyer">Lawyer</option>
                                <option value="marketing_specialist">Marketing specialist</option>
                                <option value="graphic_designer">Graphic designer</option>
                                <option value="business_analyst">Business analyst</option>
                                <option value="sales_representative">Sales representative</option>
                                <option value="customer_service_rep">Customer service representative</option>
                                <option value="project_manager">Project manager</option>
                                <option value="electrician">Electrician</option>
                                <option value="mechanic">Mechanic</option>
                                <option value="chef">Chef</option>
                                <option value="pilot">Pilot</option>
                                <option value="police_officer">Police officer</option>
                                <option value="firefighter">Firefighter</option>
                                <option value="student">Student</option>
                                <option value="unemployed">Unemployed</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="email" class="col-sm-2 col-form-label text-end">Email</label>
                        <div class="col-sm-10">
                            <input type="email" id="email" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="password" class="col-sm-2 col-form-label text-end">Password</label>
                        <div class="col-sm-10">
                            <input type="password" id="password" class="form-control"
                                placeholder="Enter new password (optional)">
                        </div>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary mt-2 btn-small">Update</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="container">
            <h2 class="contributions-header">Your contributions</h2>

            <h4 class="section-title">Your IT system reviews</h4>
            <div class="post-list" id="userPosts"></div>

            <h4 class="section-title">Your comments on IT systems</h4>
            <div class="post-list" id="itSystemComments"></div>

            <h4 class="section-title">Your questions</h4>
            <div class="post-list" id="yourQuestions"></div>

            <h4 class="section-title">Your answers</h4>
            <div class="post-list" id="yourAnswers"></div>
        </div>

        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-confirm" id="modalConfirm">
            <h5>Are you sure?</h5>
            <p>This action cannot be undone.</p>
            <button class="btn btn-danger btn-small" id="confirmDelete">Yes, Delete</button>
            <button class="btn btn-secondary btn-small" id="cancelDelete">No</button>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                console.log("Page loaded");

                const profileEmail = document.getElementById("profileEmail");
                const profileIcon = document.getElementById("profileIcon");
                const settingsCard = document.getElementById("settingsCard");
                const settingsBtn = document.getElementById("toggleSettingsBtn");
                const deleteBtn = document.getElementById("deleteAccountBtn");
                const modalConfirm = document.getElementById("modalConfirm");
                const modalOverlay = document.getElementById("modalOverlay");
                const cancelDelete = document.getElementById("cancelDelete");
                const confirmDelete = document.getElementById("confirmDelete");

                let token = localStorage.getItem("token");

                if (!token || token === "null" || token === "undefined") {
                    console.log("No valid token found, redirecting to login...");
                    logoutUser();
                } else {
                    console.log("Token found:", token);
                    fetchUserData(token);
                }

                function fetchUserData(token) {
                    fetch("http://localhost:5000/my_diss/check-token", {
                        method: "GET",
                        headers: { "Authorization": `Bearer ${token}` }
                    })
                        .then(response => response.json())
                        .then(data => {
                            console.log("check-token response:", data);

                            if (data.message === "Token is valid" && data.userId) {
                                console.log("Token is valid, userId:", data.userId);

                                if (!localStorage.getItem("userEmail")) {
                                    console.warn("`userEmail` not found in localStorage. Fetching from backend...");
                                    fetchUserEmailFromBackend(data.userId, token);
                                } else {
                                    fetchUserProfile(token);
                                }
                            } else {
                                console.warn("Invalid token or missing userId. Redirecting to login...");
                                logoutUser();
                            }
                        })
                        .catch(err => {
                            console.error("Error validating token:", err);
                            logoutUser();
                        });
                }

                function fetchUserProfile(userId, token) {
                    if (!userId || typeof userId !== "string") {
                        console.error("userId is invalid! Cannot fetch user profile.");
                        logoutUser();
                        return;
                    }

                    let email = localStorage.getItem("userEmail");

                    if (!email || email === "null" || email === "undefined") {
                        console.warn("`userEmail` not found in localStorage. Trying to fetch from backend...");
                        fetchUserEmailFromBackend(userId, token);
                        return;
                    }

                    console.log("Fetching user profile for:", email);

                    fetch(`http://localhost:5000/my_diss/get-user/${email}`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    })
                        .then(res => res.json())
                        .then(user => {
                            console.log("User profile response:", user);

                            if (user.error) {
                                console.error("User not found:", user.error);
                                logoutUser();
                            } else {
                                updateProfileUI(user);
                            }
                        })
                        .catch(err => {
                            console.error("Error fetching user data:", err);
                            logoutUser();
                        });
                }

                function fetchUserEmailFromBackend(userId, token) {
                    fetch(`http://localhost:5000/my_diss/get-user-id/${userId}`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    })
                        .then(res => res.json())
                        .then(data => {
                            if (data.email) {
                                console.log("Fetched email from backend:", data.email);
                                localStorage.setItem("userEmail", data.email);
                                fetchUserProfile(userId, token);
                            } else {
                                console.error("Could not fetch email. Logging out...");
                                logoutUser();
                            }
                        })
                        .catch(err => {
                            console.error("Error fetching email from backend:", err);
                            logoutUser();
                        });
                }

                function updateProfileUI(user) {
                    profileName.innerText = user.name || "Not logged in";

                    if (user.name) {
                        const initials = user.name.charAt(0).toUpperCase() + user.name.charAt(user.name.length - 1).toUpperCase();
                        profileIcon.innerText = initials;
                    }

                    fetchUserPosts(user._id);
                }

                function fetchUserPosts(userId) {
                    if (!userId) {
                        console.error("No userId provided for fetching data.");
                        return;
                    }

                    const token = localStorage.getItem("token");
                    if (!token) {
                        console.error("No token found in localStorage.");
                        return;
                    }

                    console.log("Fetching all user contributions for userId:", userId);

                    fetch(`http://localhost:5000/my_diss/user-posts/${userId}`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    })
                        .then(res => res.json())
                        .then(posts => {
                            const postsContainer = document.getElementById("userPosts");
                            postsContainer.innerHTML = "";

                            if (!posts || posts.length === 0) {
                                postsContainer.innerHTML = "<p>No IT system reviews found.</p>";
                                return;
                            }

                            posts.forEach(post => {
                                const postItem = document.createElement("div");
                                postItem.classList.add("post-item");
                                postItem.innerHTML = `
                                <h6>${post.companyName}</h6>
                                <p>${post.experienceDescription}</p>
                                <p> Rating: ${post.rating}</p>
                            `;
                             postsContainer.appendChild(postItem);
                            });

                            console.log("Successfully loaded user posts:", posts);
                        })
                        .catch(err => console.error("Error fetching user posts:", err));

                    fetch(`http://localhost:5000/my_diss/user-comments/${userId}`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    })
                        .then(res => res.json())
                        .then(comments => {
                            const commentsContainer = document.getElementById("itSystemComments");
                            commentsContainer.innerHTML = "";

                            if (!comments || comments.length === 0) {
                                commentsContainer.innerHTML = "<p>No comments found.</p>";
                                return;
                            }

                            comments.forEach(comment => {
                                const commentItem = document.createElement("div");
                                commentItem.classList.add("post-item");
                                commentItem.innerHTML = `
                                    <h6>${comment.companyName}</h6>
                                    <p>${comment.commentText}</p>
                                    <p> Rating: ${comment.rating}</p>
                                `;
                                commentsContainer.appendChild(commentItem);
                            });

                            console.log("Successfully loaded user comments:", comments);
                        })
                        .catch(err => console.error("Error fetching user comments:", err));

                    fetch(`http://localhost:5000/my_diss/user-questions/${userId}`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    })
                        .then(res => res.json())
                        .then(questions => {
                            const questionsContainer = document.getElementById("yourQuestions");
                            questionsContainer.innerHTML = "";

                            if (!questions || questions.length === 0) {
                                questionsContainer.innerHTML = "<p>No questions found.</p>";
                                return;
                            }

                            questions.forEach(question => {
                                const questionItem = document.createElement("div");
                                questionItem.classList.add("post-item");
                                questionItem.innerHTML = `<h6>${question.questionText}</h6>`;
                                questionsContainer.appendChild(questionItem);
                            });

                            console.log("Successfully loaded user questions:", questions);
                        })
                        .catch(err => console.error("Error fetching user questions:", err));

                    fetch(`http://localhost:5000/my_diss/user-answers/${userId}`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    })
                        .then(res => res.json())
                        .then(answers => {
                            const answersContainer = document.getElementById("yourAnswers");
                            answersContainer.innerHTML = "";

                            if (!answers || answers.length === 0) {
                                answersContainer.innerHTML = "<p>No answers found.</p>";
                                return;
                            }

                            answers.forEach(answer => {
                                const answerItem = document.createElement("div");
                                answerItem.classList.add("post-item");
                                answerItem.innerHTML = `<h6>${answer.answerText}</h6>`;
                                answersContainer.appendChild(answerItem);
                            });

                            console.log("Successfully loaded user answers:", answers);
                        })
                        .catch(err => console.error("Error fetching user answers:", err));
                }

                settingsBtn.addEventListener("click", function () {
                    settingsCard.style.display = settingsCard.style.display === "none" ? "block" : "none";
                    settingsBtn.classList.add("active-btn");
                    setTimeout(() => settingsBtn.classList.remove("active-btn"), 200);
                });

                deleteBtn.addEventListener("click", function () {
                    modalConfirm.style.display = "block";
                    modalOverlay.style.display = "block";
                });

                cancelDelete.addEventListener("click", function () {
                    modalConfirm.style.display = "none";
                    modalOverlay.style.display = "none";
                });

                confirmDelete.addEventListener("click", async function () {
                    console.log(" Deleting account...");
                    let email = localStorage.getItem("userEmail");

                    if (!email) {
                        console.error("No email found in localStorage. Cannot delete user.");
                        alert("Error: User email not found.");
                        return;
                    }

                    try {
                        const response = await fetch(`http://localhost:5000/my_diss/delete-account/${email}`, {
                            method: "DELETE",
                            headers: { "Authorization": `Bearer ${token}` },
                        });

                        if (!response.ok) {
                            throw new Error(`Server returned error: ${response.status}`);
                        }

                        const data = await response.json();
                        console.log("Account deleted:", data);

                        alert("Your account has been successfully deleted.");
                        logoutUser();
                    } catch (err) {
                        console.error("Error deleting account:", err);
                        alert("An error occurred while deleting your account.");
                    }
                });

                function logoutUser() {
                    console.warn("Logging out user...");
                    console.log("LocalStorage before logout:", localStorage);

                    localStorage.removeItem("authToken");
                    localStorage.removeItem("userId");
                    localStorage.removeItem("userEmail");

                    console.log("LocalStorage after logout:", localStorage);

                    if (!window.location.href.includes("login.html")) {
                        alert("You have been logged out.");
                        window.location.href = "login.html";
                    }
                }
            });

            async function fetchTopSystems() {
                try {
                    const response = await fetch("http://localhost:5000/my_diss");
                    if (!response.ok) throw new Error("Feil ved henting av systemer");

                    const feedbacks = await response.json();
                    feedbacks.sort((a, b) => b.rating - a.rating);
                    const top3 = feedbacks.slice(0, 3);

                    document.getElementById("topSystems").innerHTML = top3.map(system => `
                        <div class="col-md-4 mb-3">
                            <div class="system-card">
                                <img src="http://localhost:5000${system.logoPath}" alt="Logo" class="img-fluid" style="max-width: 80px;">
                                <h5 class="mt-2">${system.companyName}</h5>
                                <p>${system.experienceDescription}</p>
                                <p>Rating: ${'★'.repeat(system.rating)}${'☆'.repeat(5 - system.rating)}</p>
                            </div>
                        </div>
                    `).join("");
                } catch (error) {
                    console.error("An error accured during uploading of IT-systemer:", error);
                    document.getElementById("topSystems").innerHTML = "<p>Could not upload the systems.</p>";
                }
            }

            async function fetchQuestions() {
                try {
                    const response = await fetch("http://localhost:5000/my_diss/questions");
                    if (!response.ok) throw new Error("An error occured when uploading the questions");

                    const questions = await response.json();
                    if (!Array.isArray(questions) || questions.length === 0) {
                        document.getElementById("questions").innerHTML = "<p>No questions found.</p>";
                        return;
                    }

                    document.getElementById("questions").innerHTML = questions.map(q => `
                    <div class="green-box" data-bs-toggle="collapse" data-bs-target="#answer${q._id}">
                        <div>${q.questionText || "Not a known question"}</div>
                        <span>▼</span>
                    </div>
                    <div id="answer${q._id}" class="collapse px-3">
                        ${q.answers && q.answers.length ? q.answers.map(ans => `<p>${ans}</p>`).join(" ") : "<p>No replays avelabol.</p>"}
                    </div>
                `).join("");
                } catch (error) {
                    console.error("An error occured when uploading the questions:", error);
                    document.getElementById("questions").innerHTML = "<p>Could not download the questions.</p>";
                }
            }


            document.addEventListener("DOMContentLoaded", function () {
                console.log("Profile settings script loaded!");

                const nameInput = document.getElementById("name");
                const ageInput = document.getElementById("age");
                const genderInput = document.getElementById("gender");
                const occupationInput = document.getElementById("occupation");
                const emailInput = document.getElementById("email");
                const passwordInput = document.getElementById("password");
                const updateButton = document.querySelector(".btn-primary");

                let token = localStorage.getItem("token");

                if (!token) {
                    console.warn("No token found, redirecting to login.");
                    alert("You need to log in first.");
                    window.location.href = "login.html";
                    return;
                }

                console.log("Token found:", token);

                function fetchUserProfile() {
                    fetch("http://localhost:5000/my_diss/user-profile", {
                        method: "GET",
                        headers: { "Authorization": `Bearer ${token}` }
                    })
                        .then(response => {
                            if (!response.ok) throw new Error("Failed to fetch user profile.");
                            return response.json();
                        })
                        .then(user => {
                            console.log("Fetched user data:", user);

                            if (user.error) {
                                console.error("Error fetching user:", user.error);
                                alert("Session expired. Please log in again.");
                                logoutUser();
                                return;
                            }

                            nameInput.value = user.name || "";
                            ageInput.value = user.age || "";
                            genderInput.value = user.gender || "";
                            occupationInput.value = user.occupation || "";
                            emailInput.value = user.email || "";
                            passwordInput.value = "";

                            localStorage.setItem("userEmail", user.email);
                        })
                        .catch(error => {
                            console.error("Error fetching profile:", error);
                            alert("Error loading profile. Please try again.");
                        });
                }

                fetchUserProfile();

                updateButton.addEventListener("click", function (event) {
                    event.preventDefault();

                    const updatedProfile = {
                        name: nameInput.value,
                        age: ageInput.value,
                        gender: genderInput.value,
                        occupation: occupationInput.value,
                        email: emailInput.value,
                        password: passwordInput.value ? passwordInput.value : null
                    };

                    console.log("Sending updated profile:", updatedProfile);

                    fetch("http://localhost:5000/my_diss/update-profile", {
                        method: "PUT",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(updatedProfile)
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (data.error) {
                                console.error("Error updating profile:", data.error);
                                alert("Error updating profile: " + data.error);
                            } else {
                                alert("Profile updated successfully!");

                                if (data.token) {
                                    console.log("Storing new token in localStorage.");
                                    localStorage.setItem("token", data.token);
                                }

                                if (data.email) {
                                    localStorage.setItem("userEmail", data.email);
                                }

                                fetchUserProfile();
                            }
                        })
                        .catch(error => {
                            console.error("Error updating profile:", error);
                            alert("An error occurred while updating the profile. Please try again.");
                        });
                });

                function logoutUser() {
                    console.warn("Logging out user...");
                    localStorage.removeItem("token");
                    localStorage.removeItem("userEmail");
                    alert("Session expired. Please log in again.");
                    window.location.href = "login.html";
                }
            });

            document.addEventListener("DOMContentLoaded", function () {
                const emailInput = document.getElementById("email");
                const passwordInput = document.getElementById("password");
                const form = document.getElementById("accountSettingsForm");

                function fetchUserData() {
                    fetch("http://localhost:5000/get-user-data", { method: "GET" })
                        .then(response => response.json())
                        .then(data => {
                            emailInput.value = data.email;
                            passwordInput.value = "";
                        })
                        .catch(error => console.error("Error fetching user data:", error));
                }

                fetchUserData();

                document.addEventListener("DOMContentLoaded", function () {
                    const emailInput = document.getElementById("email");
                    const passwordInput = document.getElementById("password");
                    const updateCredentialsForm = document.getElementById("updateCredentialsForm");

                    const token = localStorage.getItem("token");
                    if (!token) {
                        alert("You need to log in first.");
                        window.location.href = "login.html";
                        return;
                    }

                    fetch("http://localhost:5000/my_diss/get-user-profile", {
                        method: "GET",
                        headers: { "Authorization": `Bearer ${token}` }
                    })
                        .then(response => response.json())
                        .then(user => {
                            if (user.error) {
                                console.error("Error fetching user:", user.error);
                                return;
                            }
                            emailInput.value = user.email || "";
                        })
                        .catch(error => console.error("Error fetching profile:", error));

                    updateCredentialsForm.addEventListener("submit", function (event) {
                        event.preventDefault();

                        const updatedEmail = emailInput.value;
                        const updatedPassword = passwordInput.value;

                        fetch("http://localhost:5000/my_diss/update-credentials", {
                            method: "PUT",
                            headers: {
                                "Authorization": `Bearer ${token}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ email: updatedEmail, password: updatedPassword })
                        })
                            .then(response => response.json())
                            .then(data => {
                                if (data.error) {
                                    alert("Error updating credentials: " + data.error);
                                } else {
                                    alert("Email and password updated successfully! Please refresh the page.");
                                    localStorage.removeItem("token"); 
                                    window.location.href = "login.html";
                                }
                            })
                            .catch(error => console.error("Error updating credentials:", error));
                    });
                });

                form.addEventListener("submit", function (event) {
                    event.preventDefault();

                    const updatedEmail = emailInput.value;
                    const updatedPassword = passwordInput.value;

                    fetch("http://localhost:5000/update-user-data", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: updatedEmail, password: updatedPassword })
                    })
                        .then(response => response.json())
                        .then(data => alert("Profile updated successfully!"))
                        .catch(error => console.error("Error updating profile:", error));
                });
            });

        </script>
