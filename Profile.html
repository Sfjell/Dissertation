<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

    <style>
        body {
            background-color: #f0f4f7;
            font-family: 'Arial', sans-serif;
        }
        .profile-header {
            background-color: #42f8b2;
            color: white;
            padding: 30px 0;
            text-align: center;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }
        .profile-picture img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid white;
        }
        .settings-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 20px;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
    </style>
</head>

<body>

    <div class="profile-header">
        <div class="profile-picture">
            <img src="https://via.placeholder.com/150" alt="Profile Picture" id="profilePic">
        </div>
        <h1 id="profileName">Loading...</h1>
        <p id="profileRole">Loading...</p>
    </div>

    <div class="container">
        <div class="settings-card">
            <h5>Account Settings</h5>
            <p>Email: <span id="profileEmail">Loading...</span></p>
            <p>Member Since: <span id="profileSince">Loading...</span></p>
            <button class="btn btn-secondary" id="logoutBtn">Log Out</button>
            <button class="btn btn-danger" id="deleteAccountBtn">Delete Account</button>
        </div>
    </div>

    <script>
        // 📌 **Sjekk om bruker er logget inn**
        const loggedInUser = localStorage.getItem("loggedInUser");

        if (!loggedInUser) {
            window.location.href = "login.html"; // Omdiriger til innlogging
        } else {
            fetch(`http://localhost:5000/get-user/${loggedInUser}`)
                .then(response => response.json())
                .then(user => {
                    document.getElementById("profileName").innerText = user.name;
                    document.getElementById("profileEmail").innerText = user.email;
                    document.getElementById("profileRole").innerText = user.role || "User";
                    document.getElementById("profileSince").innerText = user.memberSince || "Unknown";
                })
                .catch(error => {
                    console.error("Feil ved henting av brukerdata:", error);
                    window.location.href = "login.html"; // Omdiriger hvis bruker ikke finnes
                });
        }

        // 📌 **Logg ut bruker**
        document.getElementById("logoutBtn").addEventListener("click", function () {
            localStorage.removeItem("loggedInUser");
            window.location.href = "login.html";
        });

        // 📌 **Slett konto**
        document.getElementById("deleteAccountBtn").addEventListener("click", function () {
            if (confirm("Er du sikker på at du vil slette kontoen din?")) {
                fetch(`http://localhost:5000/delete-user/${loggedInUser}`, { method: "DELETE" })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                        localStorage.removeItem("loggedInUser");
                        window.location.href = "login.html";
                    })
                    .catch(error => console.error("Feil ved sletting av bruker:", error));
            }
        });
    </script>

</body>
</html>
