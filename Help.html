<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Section</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background-color: #f4f7fc; font-family: 'Arial', sans-serif; }
        .navbar { background-color: #fff; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .navbar-brand { font-size: 1.8rem; font-weight: bold; color: #333; }
        .nav-link { color: #555; font-size: 1.1rem; transition: color 0.3s ease; }
        .nav-link:hover { color: #007bff; }
        .green-box { background-color: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 5px solid #28a745; cursor: pointer; margin-bottom: 10px; transition: background 0.3s ease; }
        .green-box:hover { background-color: #e9ecef; }
        .question-toggle { font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
        .collapse { padding: 10px 15px; background-color: #f1f1f1; border-radius: 5px; margin-bottom: 10px; }
        .ask-question-btn { background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
        .ask-question-btn:hover { background-color: #0056b3; }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="2.png" alt="Brand Logo" style="height: 40px;"> SysReviewSphere
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="IT Systems.html">IT Systems</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="Help.html">Discussion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <h4 class="mt-4">People have asked these questions</h4>
        <div id="questions"></div>

        <div class="my-4">
            <h5>Ask a Question</h5>
            <textarea id="questionInput" class="form-control" rows="3" placeholder="Type your question here"></textarea>
            <div class="validation-error" id="questionError"></div>
            <button class="ask-question-btn mt-3" id="submitQuestionBtn">Submit Question</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchQuestions() {
    try {
        const response = await fetch("http://localhost:5000/my_diss/questions");
        if (!response.ok) throw new Error(`Failed to fetch questions. Status: ${response.status}`);

        const questions = await response.json();

        document.getElementById("questions").innerHTML = questions.map(question => `
            <div class="green-box question-toggle" data-bs-toggle="collapse" data-bs-target="#answer${question._id}">
                <div>${question.questionText} (Asked by: ${question.userEmail})</div>
                <span>▼</span>
            </div>
            <div id="answer${question._id}" class="collapse px-3">
                <h6>Replies:</h6>
                <div id="replies${question._id}">${(question.answers || []).map(ans => `<p>${ans.text}</p>`).join("")}</div>
                <div class="reply-box">
                    <textarea class="form-control reply-input" rows="2" placeholder="Type your reply"></textarea>
                    <button class="btn reply-btn" data-question-id="${question._id}">Submit Reply</button>
                </div>
            </div>
        `).join("");
    } catch (error) {
        console.error("❌ Error fetching questions:", error);
    }
}

document.getElementById("submitQuestionBtn").addEventListener("click", async function () {
    const questionText = document.getElementById("questionInput").value;
    const questionError = document.getElementById("questionError");

    if (questionText.trim() === '') {
        questionError.textContent = 'Please enter a question!';
        return;
    }

    questionError.textContent = '';
    const token = localStorage.getItem("token");

    try {
        const response = await fetch("http://localhost:5000/my_diss/questions", {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ questionText })
        });

        if (response.ok) {
            document.getElementById("questionInput").value = "";
            fetchQuestions();
        } else {
            console.error("❌ Failed to save question");
        }
    } catch (error) {
        console.error("❌ Error submitting question:", error);
    }
});

// 🚀 Last inn spørsmålene ved oppstart
fetchQuestions();

    </script>
</body>

</html>
