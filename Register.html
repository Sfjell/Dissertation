<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7fc; font-family: 'Arial', sans-serif; }
        .register-container { max-width: 400px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .register-title { font-size: 1.8rem; font-weight: bold; text-align: center; color: #333; margin-bottom: 20px; }
        .form-control { border-radius: 8px; }
        .btn-register { background-color: #007bff; border-color: #007bff; width: 100%; padding: 10px; border-radius: 8px; font-size: 1.2rem; }
        .btn-register:hover { background-color: #0056b3; }
        .register-footer { text-align: center; margin-top: 15px; }
    </style>
</head>

<body>
    <div class="container">
        <div class="register-container">
            <h2 class="register-title">Register</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-register">Register</button>
            </form>
            <div class="register-footer">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/my_diss/register", {  // ✅ Fixed API URL
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })  // ✅ Removed 'name'
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("userId", data.userId);
                    localStorage.setItem("userEmail", email);

                    alert("✅ Registration successful! Redirecting...");
                    window.location.href = "index.html"; // ✅ Redirect after successful registration
                } else {
                    alert(data.error || "Registration failed");
                }
            } catch (error) {
                console.error("❌ Error registering user:", error);
                alert("An error occurred. Please try again.");
            }
        });

        // ✅ If user is already logged in, redirect to homepage
        if (localStorage.getItem("token")) {
            window.location.href = "index.html";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
