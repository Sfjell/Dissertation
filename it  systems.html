<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Systems Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7fc;
            font-family: 'Arial', sans-serif;
        }

        .system-card {
            background-color: #fff;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .system-logo img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .btn-primary {
            background-color:  #e16539;
            border-color:  #e16539;
        }

        .modal-header {
            background-color:  #e16539;
            color: white;
        }

        #filterSection {
            display: none;
        }

        .navbar {
            background-color: #fff !important;
            box-shadow: none !important;
            /* Fjernet skyggen for å unngå grå linje */
            border-bottom: none !important;
            /* Fjerner eventuell grå linje */
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            width: 100%;
            background: transparent !important;
            border: none !important;
            /* Hindrer eventuelle rammer */
        }

        .navbar-collapse {
            background: transparent !important;
            border: none !important;
        }

        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            background: transparent !important;
            border: none !important;
        }

        /* Ekstra sikring for å fjerne en mulig linje som kan genereres av Bootstrap */
        .navbar::after,
        .navbar::before {
            display: none !important;
            content: "" !important;
        }

        /* Justerer brukerikon-knappen */
        .btn-outline-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
        }

        .nav-link {
            font-size: 1.1rem;
            color: #555;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #007bff;
        }

        .btn-outline-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 5px;
        }

        /* Fjerner eventuell hvit bakgrunn bak navbar */
        .navbar.fixed-top {
            background: #fff !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
        }

        .footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>

<body onload="fetchFeedback()">
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="2.png" alt="Brand Logo" style="height: 60px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="it  systems.html">IT Systems</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="help.html">Discussion</a>
                    </li>
                    <!-- Show Login if NOT logged in -->
                    <li class="nav-item" id="loginNav">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <!-- Show User Dropdown if logged in -->
                    <li class="nav-item dropdown d-none" id="userDropdown">
                        <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <h2 class="text-center mb-4">IT Systems Feedback</h2>

        <!-- Button Container -->
        <div class="button-container my-3">
            <!-- Gray Box (Filter Button) -->
            <button class="btn btn-secondary" onclick="toggleFilter()">Filter Feedback</button>

            <!-- Blue Button (Submit Feedback) -->
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#feedbackModal">
                Submit Feedback
            </button>

        </div>

        <!-- Filter Section -->
        <div id="filterSection" style="display: none;">
            <label for="filterFactor" class="form-label">Filter by Critical Success Factor:</label>
            <select class="form-select" id="filterFactor" onchange="filterFeedback()">
                <option value="All">All</option>
                <option value="Leadership">Leadership</option>
                <option value="Communication">Communication</option>
                <option value="Project approach">Project approach</option>
                <option value="Risk management">Risk management</option>
                <option value="Monitoring">Monitoring</option>
                <option value="Change management">Change management</option>
            </select>
        </div>

        <!-- Feedback List -->
        <div id="feedbackList" class="mt-4"></div>
    </div>

    <!-- Feedback Modal -->
    <div class="modal fade" id="feedbackModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Submit Feedback</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="feedbackForm">
                        <div class="mb-3">
                            <label for="companyName" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="companyName" placeholder="Enter company name"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="experienceDescription" class="form-label">Experience Description</label>
                            <textarea class="form-control" id="experienceDescription"
                                placeholder="Describe your experience" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="successFactor" class="form-label">Critical Success Factor</label>
                            <select class="form-select" id="successFactor" required>
                                <option value="Leadership">Leadership</option>
                                <option value="Communication">Communication</option>
                                <option value="Project approach">Project approach</option>
                                <option value="Risk management">Risk management</option>
                                <option value="Monitoring">Monitoring</option>
                                <option value="Change management">Change management</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="rating" class="form-label">Rating</label>
                            <select class="form-select" id="rating" required>
                                <option value="1">★☆☆☆☆</option>
                                <option value="2">★★☆☆☆</option>
                                <option value="3">★★★☆☆</option>
                                <option value="4">★★★★☆</option>
                                <option value="5">★★★★★</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="logoUpload" class="form-label">Upload Logo</label>
                            <input type="file" class="form-control" id="logoUpload" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Kommentar-modal -->
    <div class="modal fade" id="commentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Comment & Rate</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="commentForm">
                        <input type="hidden" id="feedbackId"> <!-- Skjult input for feedback ID -->
                        <div class="mb-3">
                            <label for="commentText" class="form-label">Your Comment</label>
                            <textarea class="form-control" id="commentText" placeholder="Write your comment..."
                                required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="commentRating" class="form-label">Your Rating</label>
                            <select class="form-select" id="commentRating" required>
                                <option value="1">★☆☆☆☆</option>
                                <option value="2">★★☆☆☆</option>
                                <option value="3">★★★☆☆</option>
                                <option value="4">★★★★☆</option>
                                <option value="5">★★★★★</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 SysReviewSphere. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    
    <script>

document.addEventListener("DOMContentLoaded", () => {
    checkLoginStatus();
    fetchFeedback();
});

// ✅ Sjekk om brukeren er logget inn
async function checkLoginStatus() {
    const token = localStorage.getItem("token");

    if (!token) {
        console.warn("⚠ No token found. Redirecting to login page.");
        updateNavbar(false);
        return;
    }

    try {
        const response = await fetch("http://localhost:5000/my_diss/check-token", {
            method: "GET",
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
            console.warn("⚠ Invalid or expired token. Logging out...");
            logoutUser();
        } else {
            console.log("✅ User is logged in.");
            updateNavbar(true);
        }
    } catch (error) {
        console.error("❌ Error checking token:", error);
        logoutUser();
    }
}

// ✅ Oppdater navbar basert på brukerstatus
function updateNavbar(isLoggedIn) {
    document.getElementById("loginNav").classList.toggle("d-none", isLoggedIn);
    document.getElementById("userDropdown").classList.toggle("d-none", !isLoggedIn);
}

// ✅ Logg ut bruker
function logoutUser() {
    localStorage.removeItem("token");
    localStorage.removeItem("userId");
    localStorage.removeItem("userEmail");
    updateNavbar(false);
    alert("You have been logged out.");
    window.location.href = "login.html";
}

// ✅ Hent alle tilbakemeldinger fra API-et
let allFeedbacks = [];

async function fetchFeedback() {
    try {
        const response = await fetch("http://localhost:5000/my_diss");

        if (!response.ok) throw new Error(`Failed to fetch feedback. Status: ${response.status}`);

        let feedbacks = await response.json();
        console.log("✅ API Response:", feedbacks);

        allFeedbacks = feedbacks.map(fb => ({
            ...fb,
            rating: Number(fb.rating) || 0, 
            successFactor: fb.successFactor || "Unknown"
        }));

        displayFeedbacks(allFeedbacks);
    } catch (error) {
        console.error("❌ Error fetching feedback:", error);
    }
}

// ✅ Vis tilbakemeldinger i HTML
function displayFeedbacks(feedbacks) {
    const feedbackList = document.getElementById("feedbackList");
    feedbackList.innerHTML = feedbacks.length > 0
        ? feedbacks.map(feedback => `
            <div class="system-card">
                <div class="d-flex align-items-center">
                    <div class="system-logo">
                        <img src="${feedback.logoPath ? `http://localhost:5000${feedback.logoPath}` : 'https://via.placeholder.com/100'}" alt="Logo">
                    </div>
                    <div class="ms-3">
                        <h5>${feedback.companyName}</h5>
                        <p>${feedback.experienceDescription}</p>
                        <p><strong>Success Factor:</strong> ${feedback.successFactor || 'Unknown'}</p>
                        <div>${'★'.repeat(feedback.rating)}${'☆'.repeat(5 - feedback.rating)}</div>
                    </div>
                </div>

                <div class="mt-3">
                    <button class="btn btn-info btn-sm" onclick="openCommentModal('${feedback._id}')">Comment & Rate</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteFeedback('${feedback._id}')">Delete</button>
                </div>

                <!-- Kommentarseksjon plassert UNDER -->
                <div class="mt-3 p-3 bg-light rounded">
                    <h6>Comments:</h6>
                    <div id="comments-${feedback._id}">
                        ${feedback.comments && feedback.comments.length > 0
                            ? feedback.comments.map(comment => `
                                <div class="p-2 border rounded mb-2">
                                    <p><strong>Comment by:</strong> ${comment.userName}</p>
                                    <p><strong>Rating:</strong> ${'★'.repeat(comment.rating)}${'☆'.repeat(5 - comment.rating)}</p>
                                    <p>${comment.text}</p>
                                    <button class="btn btn-danger btn-sm" onclick="deleteComment('${feedback._id}', '${comment._id}')">Delete Comment</button>
                                </div>
                            `).join("")
                            : "<p class='text-muted'>No comments yet.</p>"
                        }
                    </div>
                </div>
            </div>
        `).join("")
        : "<p class='text-center'>No feedback available.</p>";
}

// ✅ Slette kommentar
async function deleteComment(feedbackId, commentId) {
    const token = localStorage.getItem('token');

    if (!token) {
        alert('You must log in to delete a comment.');
        return;
    }

    if (!confirm('Are you sure you want to delete this comment?')) {
        return;
    }

    try {
        const response = await fetch(`http://localhost:5000/my_diss/feedback/${feedbackId}/comment/${commentId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            alert('Comment deleted successfully.');
            fetchFeedback(); // Reload feedback to reflect the change
        } else {
            const errorData = await response.json();
            alert(`Error: ${errorData.error}`);
        }
    } catch (error) {
        console.error('Error deleting comment:', error);
    }
}

// ✅ Legg til kommentar
document.getElementById("commentForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const feedbackId = document.getElementById("feedbackId").value;
    const commentText = document.getElementById("commentText").value;
    const commentRating = document.getElementById("commentRating").value;

    const token = localStorage.getItem("token");

    if (!token) {
        alert("You must log in to comment.");
        return;
    }

    try {
        const response = await fetch(`http://localhost:5000/my_diss/feedback/${feedbackId}/comment`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ text: commentText, rating: Number(commentRating) })
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Server error: ${errorText}`);
        }

        alert("Comment & rating submitted successfully!");

        // ✅ Oppdater kommentarene direkte på siden
        await updateComments(feedbackId);
    } catch (error) {
        console.error("Error submitting comment:", error);
        alert("Error submitting comment. Check console for details.");
    }
});

// ✅ Oppdater kommentarer etter å ha lagt til en ny kommentar
async function updateComments(feedbackId) {
    try {
        const response = await fetch(`http://localhost:5000/my_diss/feedback/${feedbackId}`);
        if (!response.ok) throw new Error(`Failed to fetch updated feedback. Status: ${response.status}`);

        const feedback = await response.json();

        const commentsDiv = document.getElementById(`comments-${feedbackId}`);
        commentsDiv.innerHTML = feedback.comments && feedback.comments.length > 0
            ? feedback.comments.map(comment => `
                <div class="p-2 border rounded mb-2">
                    <p><strong>Rating:</strong> ${'★'.repeat(comment.rating)}${'☆'.repeat(5 - comment.rating)}</p>
                    <p>${comment.text}</p>
                </div>
            `).join("")
            : "<p class='text-muted'>No comments yet.</p>";
    } catch (error) {
        console.error("❌ Error fetching updated comments:", error);
    }
}

// ✅ Filtrer tilbakemeldinger
function filterFeedback() {
    const filterValue = document.getElementById("filterFactor").value;
    const filteredFeedbacks = filterValue === "All"
        ? allFeedbacks
        : allFeedbacks.filter(feedback => feedback.successFactor === filterValue);

    displayFeedbacks(filteredFeedbacks);
}

// ✅ Toggle filter-seksjon
function toggleFilter() {
    const filterSection = document.getElementById("filterSection");
    if (filterSection.style.display === "none" || filterSection.style.display === "") {
        filterSection.style.display = "block";
    } else {
        filterSection.style.display = "none";
    }
}

// ✅ Innsending av tilbakemelding
document.getElementById('feedbackForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const companyName = document.getElementById('companyName').value;
    const experienceDescription = document.getElementById('experienceDescription').value;
    const successFactor = document.getElementById('successFactor').value;
    const rating = document.getElementById('rating').value;
    const logoFile = document.getElementById('logoUpload').files[0];

    const formData = new FormData();
    formData.append('companyName', companyName);
    formData.append('experienceDescription', experienceDescription);
    formData.append('successFactor', successFactor);
    formData.append('rating', rating);
    if (logoFile) formData.append('logo', logoFile);

    const token = localStorage.getItem('token');

    if (!token) {
        alert('You must log in to submit feedback.');
        return;
    }

    try {
        const response = await fetch('http://localhost:5000/my_diss/feedback', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
        });

        if (response.ok) {
            alert("Feedback submitted successfully!");
            fetchFeedback();
        } else {
            const errorData = await response.json();
            alert(`Error: ${errorData.error}`);
        }
    } catch (error) {
        console.error("Error submitting feedback:", error);
    }
});

// ✅ Slett tilbakemelding
async function deleteFeedback(feedbackId) {
    const token = localStorage.getItem('token');

    if (!token) {
        alert('You must log in to delete feedback.');
        return;
    }

    if (!confirm('Are you sure you want to delete this feedback?')) {
        return;
    }

    try {
        const response = await fetch(`http://localhost:5000/my_diss/feedback/${feedbackId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            alert('Feedback deleted successfully.');
            fetchFeedback();
        } else {
            const errorData = await response.json();
            alert(`Error: ${errorData.error}`);
        }
    } catch (error) {
        console.error('Error deleting feedback:', error);
    }
}

// ✅ Åpne kommentarmodal
function openCommentModal(feedbackId) {
    document.getElementById("feedbackId").value = feedbackId;
    document.getElementById("commentText").value = "";
    document.getElementById("commentRating").value = "3"; // Default rating

    var commentModal = new bootstrap.Modal(document.getElementById('commentModal'));
    commentModal.show();
}




    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
