<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Systems Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7fc;
            font-family: 'Arial', sans-serif;
        }

        .system-card {
            background-color: #fff;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .system-logo img {
            max-width: 100px;
            max-height: 100px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: auto;
        }

        .btn-primary {
            background-color: #e16539;
            border-color: #e16539;
        }

        .modal-header {
            background-color: #e16539;
            color: white;
        }

        #filterSection {
            display: none;
        }

        .navbar {
            background-color: #fff !important;
            box-shadow: none !important;
            border-bottom: none !important;
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            width: 100%;
            background: transparent !important;
            border: none !important;
        }

        .navbar-collapse {
            background: transparent !important;
            border: none !important;
        }

        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            background: transparent !important;
            border: none !important;
        }

        .navbar::after,
        .navbar::before {
            display: none !important;
            content: "" !important;
        }

        .btn-outline-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
        }

        .nav-link {
            font-size: 1.1rem;
            color: #555;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #007bff;
        }

        .btn-outline-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 5px;
        }

        .navbar.fixed-top {
            background: #fff !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: start;
            font-size: 1.5rem;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            cursor: pointer;
            color: #ccc;
            margin: 0 5px;
        }

        .star-rating input:checked~label {
            color: #e16539;
        }


        .container {
            flex: 1;
        }

        .footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>

<body onload="fetchFeedback()">
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="2.png" alt="Brand Logo" style="height: 60px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="it  systems.html">IT Systems</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="help.html">Discussion</a>
                    </li>
                    <li class="nav-item" id="loginNav">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item dropdown d-none" id="userDropdown">
                        <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <h2 class="text-center mb-4">IT Systems Feedback</h2>
        <div class="button-container my-3">
            <button class="btn btn-secondary" onclick="toggleFilter()">Filter Feedback</button>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#feedbackModal">
                Submit Feedback
            </button>
        </div>

        <div id="filterSection" style="display: none;">
            <label for="filterFactor" class="form-label">Filter by Critical Success Factor:</label>
            <select class="form-select" id="filterFactor" onchange="filterFeedback()">
                <option value="All">All</option>
                <option value="Leadership">Leadership</option>
                <option value="Communication">Communication</option>
                <option value="Project approach">Project approach</option>
                <option value="Risk management">Risk management</option>
                <option value="Monitoring">Monitoring</option>
                <option value="Change management">Change management</option>
                <option value="Implimentation Methodology">Implimentation Methodology</option>
            </select>
        </div>
        <div id="feedbackList" class="mt-4"></div>
    </div>

    <div class="modal fade" id="feedbackModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Submit Feedback</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="feedbackForm">
                        <div class="mb-3">
                            <label for="companyName" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="companyName" placeholder="Enter company name"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="experienceDescription" class="form-label">Experience Description</label>
                            <textarea class="form-control" id="experienceDescription"
                                placeholder="Describe your experience" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="successFactor" class="form-label">Critical Success Factor</label>
                            <select class="form-select" id="successFactor" required>
                                <option value="Leadership">Leadership</option>
                                <option value="Communication">Communication</option>
                                <option value="Project approach">Project approach</option>
                                <option value="Risk management">Risk management</option>
                                <option value="Monitoring">Monitoring</option>
                                <option value="Change management">Change management</option>
                                <option value="Implimentation Methodology">Implimentation Methodology</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rating</label>
                            <div class="star-rating">
                                <input type="radio" id="star5" name="rating" value="5"><label for="star5"><i
                                        class="fas fa-star"></i></label>
                                <input type="radio" id="star4" name="rating" value="4"><label for="star4"><i
                                        class="fas fa-star"></i></label>
                                <input type="radio" id="star3" name="rating" value="3"><label for="star3"><i
                                        class="fas fa-star"></i></label>
                                <input type="radio" id="star2" name="rating" value="2"><label for="star2"><i
                                        class="fas fa-star"></i></label>
                                <input type="radio" id="star1" name="rating" value="1"><label for="star1"><i
                                        class="fas fa-star"></i></label>
                            </div>

                        </div>
                        <div class="mb-3">
                            <label for="logoUpload" class="form-label">Upload Logo</label>
                            <input type="file" class="form-control" id="logoUpload" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="commentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Comment & Rate</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="commentForm">
                        <input type="hidden" id="feedbackId">
                        <div class="mb-3">
                            <label for="commentText" class="form-label">Your Comment</label>
                            <textarea class="form-control" id="commentText" placeholder="Write your comment..."
                                required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="commentRating" class="form-label">Your Rating</label> <label for="commentRating"
                                class="form-label">Your Rating</label>
                            <div class="star-rating">
                                <input type="radio" id="star5c" name="commentRating" value="5"><label for="star5c"><i
                                        class="fas fa-star"></i></label>
                                <input type="radio" id="star4c" name="commentRating" value="4"><label for="star4c"><i
                                        class="fas fa-star"></i></label>
                                <input type="radio" id="star3c" name="commentRating" value="3"><label for="star3c"><i
                                        class="fas fa-star"></i></label>
                                <input type="radio" id="star2c" name="commentRating" value="2"><label for="star2c"><i
                                        class="fas fa-star"></i></label>
                                <input type="radio" id="star1c" name="commentRating" value="1"><label for="star1c"><i
                                        class="fas fa-star"></i></label>
                            </div>
                        </div>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 SysReviewSphere. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            checkLoginStatus();
            fetchFeedback();
        });

        async function checkLoginStatus() {
            const token = localStorage.getItem("token");

            if (!token) {
                console.warn("⚠ No token found. Redirecting to login page.");
                updateNavbar(false);
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/my_diss/check-token", {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!response.ok) {
                    console.warn("⚠ Invalid or expired token. Logging out...");
                    logoutUser();
                } else {
                    console.log("User is logged in.");
                    updateNavbar(true);
                }
            } catch (error) {
                console.error("Error checking token:", error);
                logoutUser();
            }
        }

        function updateNavbar(isLoggedIn) {
            document.getElementById("loginNav").classList.toggle("d-none", isLoggedIn);
            document.getElementById("userDropdown").classList.toggle("d-none", !isLoggedIn);
        }

        function logoutUser() {
            localStorage.removeItem("token");
            localStorage.removeItem("userId");
            localStorage.removeItem("userEmail");
            updateNavbar(false);
            alert("You have been logged out.");
            window.location.href = "login.html";
        }

        let allFeedbacks = [];

        async function fetchFeedback() {
            try {
                const response = await fetch("http://localhost:5000/my_diss");

                if (!response.ok) throw new Error(`Failed to fetch feedback. Status: ${response.status}`);

                let feedbacks = await response.json();
                console.log("API Response:", feedbacks);

                allFeedbacks = feedbacks.map(fb => ({
                    ...fb,
                    rating: Number(fb.rating) || 0,
                    successFactor: fb.successFactor || "Unknown"
                }));

                displayFeedbacks(allFeedbacks);
            } catch (error) {
                console.error("Error fetching feedback:", error);
            }
        }

        function displayFeedbacks(feedbacks) {
            const feedbackList = document.getElementById("feedbackList");
            const currentUserId = localStorage.getItem("userId");

            feedbackList.innerHTML = feedbacks.length > 0
                ? feedbacks.map(feedback => `
        <div class="system-card">
            <div class="d-flex align-items-center">
                <div class="system-logo">
                   <img src="${feedback.logoPath ? `http://localhost:5000${feedback.logoPath}` : 'https://via.placeholder.com/100'}" 
                    alt="Company Logo" class="img-fluid" style="max-width: 100px; max-height: 100px; object-fit: contain;">
                </div>
                <div class="ms-3">
                    <h5>${feedback.companyName}</h5>
                    <p>${feedback.experienceDescription}</p>
                    <p><strong>Success Factor:</strong> ${feedback.successFactor || 'Unknown'}</p>
                    <div>${generateStarRating(feedback.rating)}</div>
                </div>
            </div>

            <div class="mt-3">
                <button class="btn btn-info btn-sm" onclick="openCommentModal('${feedback._id}')">Comment & Rate</button>

                ${feedback.userId?._id === currentUserId ? `
                    <button class="btn btn-danger btn-sm" onclick="deleteFeedback('${feedback._id}')">Delete</button>
                ` : ''}
            </div>

            <div class="mt-3 p-3 bg-light rounded">
                <h6>Comments:</h6>
                <div id="comments-${feedback._id}">
                    ${feedback.comments && feedback.comments.length > 0
                        ? feedback.comments.map(comment => `
                            <div class="p-2 border rounded mb-2">
                                <p><strong>Comment by:</strong>  ${comment.userId?.email || 'Anonymous'}</p>
                                <p><strong>Rating:</strong> ${generateStarRating(comment.rating)}</p>
                                <p>${comment.text}</p>

                                ${comment.userId?._id === currentUserId ? `
                                    <button class="btn btn-danger btn-sm" onclick="deleteComment('${feedback._id}', '${comment._id}')">Delete Comment</button>
                                ` : ''}
                            </div>
                        `).join("")
                        : "<p class='text-muted'>No comments yet.</p>"
                    }
                </div>
            </div>
        </div>
    `).join("")
                : "<p class='text-center'>No feedback available.</p>";
        }

        async function deleteComment(feedbackId, commentId) {
            const token = localStorage.getItem('token');

            if (!token) {
                alert('You must log in to delete a comment.');
                return;
            }

            if (!confirm('Are you sure you want to delete this comment?')) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/my_diss/feedback/${feedbackId}/comment/${commentId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    alert('Comment deleted successfully.');
                    fetchFeedback();
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error deleting comment:', error);
            }
        }

        document.getElementById("commentForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const feedbackId = document.getElementById("feedbackId").value;
            const commentText = document.getElementById("commentText").value.trim();
            const commentRating = getSelectedRating();
            const token = localStorage.getItem("token");

            console.log("Submitting comment with data:", { text: commentText, rating: commentRating });

            if (!token) {
                alert("You must log in to comment.");
                return;
            }

            if (!commentText || !commentRating) {
                alert("Please enter both a comment and a rating.");
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/my_diss/feedback/${feedbackId}/comment`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ text: commentText, rating: Number(commentRating) })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error: ${errorText}`);
                }

                alert("Comment & rating submitted successfully!");
                await updateComments(feedbackId);
                document.getElementById("commentModal").classList.remove("show");
                document.body.classList.remove("modal-open");
                document.querySelector(".modal-backdrop").remove();

            } catch (error) {
                console.error("Error submitting comment:", error);
                alert("Error submitting comment. Check console for details.");
            }
        });

        async function updateComments(feedbackId) {
            console.log("Fetching updated comments for Feedback ID:", feedbackId);

            try {
                const response = await fetch(`http://localhost:5000/my_diss/feedback/${feedbackId}`);

                if (!response.ok) {
                    console.error("Error fetching updated comments:", response.status, response.statusText);
                    throw new Error(`Failed to fetch updated feedback. Status: ${response.status}`);
                }

                const feedback = await response.json();
                console.log("Updated feedback data:", feedback);

                const commentsDiv = document.getElementById(`comments-${feedbackId}`);
                commentsDiv.innerHTML = feedback.comments.length > 0
                    ? feedback.comments.map(comment => `
                <div class="p-2 border rounded mb-2">
                    <p><strong>Comment by:</strong> ${comment.userId?.email || 'Anonymous'}</p>
                    <p>${comment.text}</p>
                </div>
            `).join("")
                    : "<p class='text-muted'>No comments yet.</p>";

            } catch (error) {
                console.error("Error fetching updated comments:", error);
            }
        }

        function filterFeedback() {
            const filterValue = document.getElementById("filterFactor").value;
            const filteredFeedbacks = filterValue === "All"
                ? allFeedbacks
                : allFeedbacks.filter(feedback => feedback.successFactor === filterValue);

            displayFeedbacks(filteredFeedbacks);
        }

        function toggleFilter() {
            const filterSection = document.getElementById("filterSection");
            if (filterSection.style.display === "none" || filterSection.style.display === "") {
                filterSection.style.display = "block";
            } else {
                filterSection.style.display = "none";
            }
        }
        function getSelectedRating() {
            const selectedStar = document.querySelector('#commentModal input[name="commentRating"]:checked');
            return selectedStar ? selectedStar.value : null;
        }

        document.getElementById('feedbackForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const companyName = document.getElementById('companyName').value;
            const experienceDescription = document.getElementById('experienceDescription').value;
            const successFactor = document.getElementById('successFactor').value;
            const rating = getSelectedRating();
            const logoFile = document.getElementById('logoUpload').files[0];


            const formData = new FormData();
            formData.append('companyName', companyName);
            formData.append('experienceDescription', experienceDescription);
            formData.append('successFactor', successFactor);
            formData.append('rating', rating);
            if (logoFile) formData.append('logo', logoFile);

            const token = localStorage.getItem('token');

            if (!token) {
                alert('You must log in to submit feedback.');
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/my_diss/feedback', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (response.ok) {
                    alert("Feedback submitted successfully!");
                    fetchFeedback();
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.error}`);
                }
            } catch (error) {
                console.error("Error submitting feedback:", error);
            }
        });

        function getSelectedRating() {
            const selectedStar = document.querySelector('input[name="rating"]:checked');
            return selectedStar ? selectedStar.value : null;
        }

        document.addEventListener("DOMContentLoaded", function () {
            const ratingElement = document.querySelector('input[name="rating"]:checked');
            if (ratingElement) {
                console.log("Rating valgt:", ratingElement.value);
            } else {
                console.error("Ingen rating er valgt.");
            }
        });

        function generateStarRating(rating) {
            let starsHTML = "";
            for (let i = 1; i <= 5; i++) {
                if (i <= rating) {
                    starsHTML += `<i class="fas fa-star text-warning"></i> `; 
                } else {
                    starsHTML += `<i class="far fa-star text-warning"></i> `; 
                }
            }
            return starsHTML;
        }

        async function deleteFeedback(feedbackId) {
            const token = localStorage.getItem('token');

            if (!token) {
                alert('You must log in to delete feedback.');
                return;
            }

            if (!confirm('Are you sure you want to delete this feedback?')) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/my_diss/feedback/${feedbackId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    alert('Feedback deleted successfully.');
                    fetchFeedback();
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error deleting feedback:', error);
            }
        }

        function openCommentModal(feedbackId) {
            const feedbackInput = document.getElementById("feedbackId");
            const commentText = document.getElementById("commentText");

            if (!feedbackInput) {
                console.error("FEIL: Skjult input for feedbackId mangler i DOM.");
                return;
            }

            feedbackInput.value = feedbackId; 

            if (commentText) {
                commentText.value = ""; 
            }

            document.querySelectorAll("#commentModal input[name='commentRating']").forEach(star => {
                star.checked = false;
            });

            const commentModal = new bootstrap.Modal(document.getElementById("commentModal"));
            commentModal.show();
        }

        document.addEventListener("DOMContentLoaded", function () {
            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", function () {
                    console.log("Logout button clicked!");

                    localStorage.removeItem("token");
                    localStorage.removeItem("userId");
                    localStorage.removeItem("userEmail");

                    console.log("Local storage cleared!");

                    document.getElementById("loginNav").classList.remove("d-none");
                    document.getElementById("userDropdown").classList.add("d-none");

                    alert("Logged out successfully!");
                    window.location.href = "index.html";
                });
            } else {
                console.error("Logout button not found in DOM!");
            }
        });

        function checkLoginStatus() {
            const token = localStorage.getItem("token");
            if (token) {
                console.log("User is logged in.");
                document.getElementById("loginNav").classList.add("d-none");
                document.getElementById("userDropdown").classList.remove("d-none");
            } else {
                console.log("⚠ No token found. User is logged out.");
                document.getElementById("loginNav").classList.remove("d-none");
                document.getElementById("userDropdown").classList.add("d-none");
            }
        }
        document.addEventListener("DOMContentLoaded", checkLoginStatus);

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
