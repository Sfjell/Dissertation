<body onload="fetchFeedback()">
    <body onload="fetchFeedback()">
        <nav class="navbar navbar-expand-lg navbar-light fixed-top">

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">

                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="Profile.html">Profile</a></li>

                        </li>

        <div class="container mt-5 pt-5">
            <h2 class="text-center mb-4">IT Systems Feedback</h2>
    
            <!-- Button Container -->
            <div class="button-container my-3">
                <!-- Gray Box (Filter Button) -->
                <button class="btn btn-secondary" onclick="toggleFilter()">Filter Feedback</button>

            <!-- Filter Section -->
            <div id="filterSection" style="display: none;">
                <label for="filterFactor" class="form-label">Filter by Critical Success Factor:</label>
                <select class="form-select" id="filterFactor" onchange="filterFeedback()">
                    <option value="All">All</option>
                    <option value="Leadership">Leadership</option>
                    <option value="Communication">Communication</option>
                    <option value="Project approach">Project approach</option>
                    <option value="Risk management">Risk management</option>
                    <option value="Monitoring">Monitoring</option>

            <!-- Feedback List -->
            <div id="feedbackList" class="mt-4"></div>
        </div>
    
        <!-- Feedback Modal -->
        <div class="modal fade" id="feedbackModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Submit Feedback</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="feedbackForm">
                            <div class="mb-3">
                                <label for="companyName" class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="companyName" placeholder="Enter company name" required>
                            </div>
                            <div class="mb-3">
                                <label for="experienceDescription" class="form-label">Experience Description</label>
                                <textarea class="form-control" id="experienceDescription" placeholder="Describe your experience" rows="3" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="successFactor" class="form-label">Critical Success Factor</label>
                                <select class="form-select" id="successFactor" required>
                                    <option value="Leadership">Leadership</option>
                                    <option value="Communication">Communication</option>
                                    <option value="Project approach">Project approach</option>
                                    <option value="Risk management">Risk management</option>
                                    <option value="Monitoring">Monitoring</option>
                                    <option value="Change management">Change management</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="rating" class="form-label">Rating</label>
                                <select class="form-select" id="rating" required>
                                    <option value="1">★☆☆☆☆</option>
                                    <option value="2">★★☆☆☆</option>
                                    <option value="3">★★★☆☆</option>
                                    <option value="4">★★★★☆</option>
                                    <option value="5">★★★★★</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="logoUpload" class="form-label">Upload Logo</label>
                                <input type="file" class="form-control" id="logoUpload" accept="image/*">
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    <footer class="footer">

    <script>

async function checkLoginStatus() {
    const token = localStorage.getItem("token");

    if (!token) {
        console.warn("⚠ No token found. Redirecting to login page.");
        updateNavbar(false);
        if (!window.location.href.includes("login.html")) {
            window.location.href = "login.html";
        }
        return;
    }

    try {
        const response = await fetch("http://localhost:5000/my_diss/check-token", {
            method: "GET",
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
            console.warn("⚠ Invalid or expired token. Logging out...");
            logoutUser();
        } else {
            console.log("✅ User is logged in.");
            updateNavbar(true);
        }
    } catch (error) {
        console.error("❌ Error checking token:", error);
        logoutUser();
    }
}

// ✅ Oppdater navbar basert på brukerstatus
function updateNavbar(isLoggedIn) {
    const loginNav = document.getElementById("loginNav");
    const userDropdown = document.getElementById("userDropdown");

    if (isLoggedIn) {
        loginNav.classList.add("d-none");
        userDropdown.classList.remove("d-none");
    } else {
        loginNav.classList.remove("d-none");
        userDropdown.classList.add("d-none");
    }
}

// ✅ Logg ut bruker
function logoutUser() {
    localStorage.removeItem("token");
    localStorage.removeItem("userId");
    localStorage.removeItem("userEmail");
    updateNavbar(false);
    alert("You have been logged out.");
    window.location.href = "login.html";
}

// ✅ Kjør login-sjekk når siden lastes
document.addEventListener("DOMContentLoaded", checkLoginStatus);

// ✅ Logg inn bruker
async function loginUser(email, password) {
    try {
        const response = await fetch("http://localhost:5000/my_diss/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            // ✅ Lagre brukerdata
            localStorage.setItem("token", data.token);
            localStorage.setItem("userId", data.userId);
            localStorage.setItem("userEmail", email);

            alert("✅ Login successful!");
            updateNavbar(true);

            // ✅ Omdiriger til startsiden eller ønsket side
            window.location.href = "index.html";
        } else {
            alert(`Error: ${data.error || "Invalid login credentials"}`);
            localStorage.removeItem("token");
        }
    } catch (error) {
        console.error("❌ Error logging in:", error);
        alert("An error occurred. Please try again later.");
    }
}

// ✅ Oppdatering for å unngå feil med `successFactor`
function displayFeedbacks(feedbacks) {
    const feedbackList = document.getElementById("feedbackList");
    feedbackList.innerHTML = feedbacks.length > 0
        ? feedbacks.map(feedback => `
        <div class="system-card d-flex align-items-center justify-content-between">
            <div class="d-flex">
                <div class="system-logo">
                    <img src="${feedback.logoPath ? `http://localhost:5000${feedback.logoPath}` : 'https://via.placeholder.com/100'}" alt="Logo">
                </div>
                <div class="ms-3">
                    <h5>${feedback.companyName}</h5>
                    <p>${feedback.experienceDescription}</p>
                    <p><strong>Success Factor:</strong> ${feedback.successFactor || 'Not provided'}</p>
                    <div>${'★'.repeat(feedback.rating)}${'☆'.repeat(5 - feedback.rating)}</div>
                </div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deleteFeedback('${feedback._id}')">Delete</button>
        </div>
    `).join("")
        : "<p class='text-center'>No feedback available.</p>";
}


        // ✅ Kjør automatisk når siden lastes
        document.addEventListener("DOMContentLoaded", checkLoginStatus);
        let allFeedbacks = []; // For å lagre alle feedbacks for filtrering

        // ✅ Hent alle tilbakemeldinger
        async function fetchFeedback() {
            try {
                const response = await fetch("http://localhost:5000/my_diss");
                if (!response.ok) throw new Error(`Failed to fetch feedback. Status: ${response.status}`);

                allFeedbacks = await response.json();
                displayFeedbacks(allFeedbacks); // Vise tilbakemeldinger på siden
            } catch (error) {
                console.error("Error fetching feedback:", error);
            }
        }

        document.querySelectorAll(".btn-danger").forEach(button => {
            button.addEventListener("click", function (event) {
                const confirmDelete = confirm("Are you sure you want to delete this feedback?");
                if (!confirmDelete) {
                    event.preventDefault();
                }
            });
        });

        // ✅ Vise tilbakemeldinger i HTML
        function displayFeedbacks(feedbacks) {
            const feedbackList = document.getElementById("feedbackList");
            feedbackList.innerHTML = feedbacks.length > 0
                ? feedbacks.map(feedback => `
            <div class="system-card d-flex align-items-center">
                <div class="system-logo">
                    <img src="${feedback.logoPath ? `http://localhost:5000${feedback.logoPath}` : 'https://via.placeholder.com/100'}" alt="Logo">
                </div>
                <div class="ms-3">
                    <h5>${feedback.companyName}</h5>
                    <p>${feedback.experienceDescription}</p>
                    <p><strong>Success Factor:</strong> ${feedback.successFactor}</p>
                    <div>${'★'.repeat(feedback.rating)}${'☆'.repeat(5 - feedback.rating)}</div>
                </div>
            </div>
        `).join("")
                : "<p class='text-center'>No feedback available.</p>";
        }

        // ✅ Veksle visning av filterseksjonen
        function toggleFilter() {
            const filterSection = document.getElementById("filterSection");
            filterSection.style.display = filterSection.style.display === "none" ? "block" : "none";
        }

        // ✅ Filtrere tilbakemeldinger
        function filterFeedback() {
            const filterValue = document.getElementById("filterFactor").value;
            const filteredFeedbacks = filterValue === "All"
                ? allFeedbacks
                : allFeedbacks.filter(feedback => feedback.successFactor === filterValue);
            displayFeedbacks(filteredFeedbacks);
        }

        // ✅ Innsending av tilbakemelding
        document.getElementById('feedbackForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const companyName = document.getElementById('companyName').value;
            const experienceDescription = document.getElementById('experienceDescription').value;
            const successFactor = document.getElementById('successFactor').value;
            const rating = document.getElementById('rating').value;
            const logoFile = document.getElementById('logoUpload').files[0];

            const formData = new FormData();
            formData.append('companyName', companyName);
            formData.append('experienceDescription', experienceDescription);
            formData.append('successFactor', successFactor);
            formData.append('rating', rating);
            if (logoFile) formData.append('logo', logoFile);

            const token = localStorage.getItem('token'); // Hent token fra localStorage

            if (!token) {
                alert('You must log in to submit feedback.');
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/my_diss/feedback', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }, // Legg token i Authorization-header
                    body: formData
                });

                if (response.ok) {
                    alert("Feedback submitted successfully!");
                    fetchFeedback(); // Oppdater listen over tilbakemeldinger
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.error}`);
                }
            } catch (error) {
                console.error("Error submitting feedback:", error);
            }
        });

        async function deleteFeedback(feedbackId) {
            const token = localStorage.getItem('token');

            if (!token) {
                alert('You must log in to delete feedback.');
                return;
            }

            if (!confirm('Are you sure you want to delete this feedback?')) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/my_diss/feedback/${feedbackId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    alert('Feedback deleted successfully.');
                    fetchFeedback(); // Oppdater listen etter sletting
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error deleting feedback:', error);
            }
        }

        // ✅ Sjekk login-status automatisk når siden lastes
        document.addEventListener("DOMContentLoaded", checkLoginStatus);
        function displayFeedbacks(feedbacks) {
            const feedbackList = document.getElementById("feedbackList");
            feedbackList.innerHTML = feedbacks.length > 0
                ? feedbacks.map(feedback => `
            <div class="system-card d-flex align-items-center justify-content-between">
                <div class="d-flex">
                    <div class="system-logo">
                        <img src="${feedback.logoPath ? `http://localhost:5000${feedback.logoPath}` : 'https://via.placeholder.com/100'}" alt="Logo">
                    </div>
                    <div class="ms-3">
                        <h5>${feedback.companyName}</h5>
                        <p>${feedback.experienceDescription}</p>
                        <p><strong>Success Factor:</strong> ${feedback.successFactor || 'undefined'}</p>
                        <div>${'★'.repeat(feedback.rating)}${'☆'.repeat(5 - feedback.rating)}</div>
                    </div>
                </div>
                <button class="btn btn-danger btn-sm" onclick="deleteFeedback('${feedback._id}')">Delete</button>
            </div>
        `).join("")
                : "<p class='text-center'>No feedback available.</p>";
        }


        // ✅ Logg inn og lagre token
        async function loginUser(email, password) {
            try {
                const response = await fetch('http://localhost:5000/my_diss/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // ✅ Lagre token og brukerdata
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('userEmail', email);

                    alert('✅ Login successful!');

                    // ✅ Oppdater UI for å vise at brukeren er innlogget
                    document.getElementById("loginNav").classList.add("d-none");
                    document.getElementById("userDropdown").classList.remove("d-none");

                    // ✅ Omdiriger til hjemmesiden eller ønsket side
                    window.location.href = "index.html";
                } else {
                    alert(`Error: ${data.error || "Invalid login credentials"}`);
                    localStorage.removeItem("token"); // Fjern ubrukelig token
                }
            } catch (error) {
                console.error("❌ Error logging in:", error);
                alert("An error occurred. Please try again later.");
            }
        }


        // ✅ Logg ut og fjern token
        function logoutUser() {
    localStorage.removeItem("token");
    localStorage.removeItem("userId");
    localStorage.removeItem("userEmail");
    updateNavbar(false); // ✅ Oppdater navbaren
    alert("You have been logged out.");
    window.location.href = "login.html"; // ✅ Sørger for at brukeren går til login-siden
}

    </script>
