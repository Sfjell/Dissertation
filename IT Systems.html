<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Systems Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background-color: #f4f7fc; font-family: 'Arial', sans-serif; }
        .navbar { background-color: #fff; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .navbar-brand { font-size: 1.8rem; font-weight: bold; color: #333; }
        .nav-link { color: #555; font-size: 1.1rem; transition: color 0.3s ease; }
        .nav-link:hover { color: #007bff; }
        .system-card { background-color: #fff; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
        .system-logo img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
        .system-info h5 { font-size: 1.4rem; font-weight: bold; }
        .btn-primary { background-color: #007bff; border-color: #007bff; padding: 10px 20px; font-size: 1.2rem; }
        .modal-header { background-color: #007bff; color: white; }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="2.png" alt="Brand Logo" style="height: 40px;"> SysReviewSphere
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="IT Systems.html">IT Systems</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Help.html">Discussion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <h2 class="text-center my-4">IT Systems Feedback</h2>

        <div id="feedbackList"></div>

        <button type="button" class="btn btn-primary mt-4" data-bs-toggle="modal" data-bs-target="#feedbackModal">
            Submit Feedback
        </button>
    </div>

    <!-- Feedback Modal -->
    <div class="modal fade" id="feedbackModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Submit Feedback</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="feedbackForm">
                        <div class="mb-3">
                            <label for="companyName" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="companyName" required>
                        </div>
                        <div class="mb-3">
                            <label for="experienceDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="experienceDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="logoUpload" class="form-label">Upload Logo</label>
                            <input type="file" class="form-control" id="logoUpload">
                        </div>
                        <div class="mb-3">
                            <label for="rating" class="form-label">Rating</label>
                            <select class="form-select" id="rating" required>
                                <option value="1">★☆☆☆☆</option>
                                <option value="2">★★☆☆☆</option>
                                <option value="3">★★★☆☆</option>
                                <option value="4">★★★★☆</option>
                                <option value="5">★★★★★</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                    <div id="successMessage" class="alert alert-success mt-3" style="display: none;">Feedback submitted!</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchFeedback() {
            try {
                const response = await fetch("http://localhost:5000/my_diss");
                const feedbacks = await response.json();
                document.getElementById("feedbackList").innerHTML = feedbacks.map(feedback => `
                    <div class="system-card">
                        <div class="d-flex align-items-center">
                            <div class="system-logo">
                                <img src="http://localhost:5000${feedback.logoPath}" alt="Logo">
                            </div>
                            <div class="system-info ms-3">
                                <h5>${feedback.companyName}</h5>
                                <p>${feedback.experienceDescription}</p>
                            </div>
                        </div>
                        <div class="system-rating">
                            ${'★'.repeat(feedback.rating)}${'☆'.repeat(5 - feedback.rating)}
                        </div>
                    </div>
                `).join("");
            } catch (error) {
                console.error("Error fetching feedback:", error);
            }
        }

        document.getElementById("feedbackForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            try {
                const response = await fetch("http://localhost:5000/my_diss", {
                    method: "POST",
                    body: formData
                });
                if (response.ok) {
                    document.getElementById("successMessage").style.display = "block";
                    event.target.reset();
                    fetchFeedback();
                } else {
                    console.error("Failed to save feedback");
                }
            } catch (error) {
                console.error("Error submitting feedback:", error);
            }
        });

        fetchFeedback();
    </script>
</body>
</html>
